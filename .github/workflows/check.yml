name: Go quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: true
      - run: ./scripts/check.sh
      - run: go test -race -tags sqlite_fts5 -count=1 ./...
      - run: go build -tags sqlite_fts5 -trimpath -o bin/dotamanai-codex ./cmd/dotamanai-codex
      - run: python3 tests/pty_smoke.py
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - run: govulncheck -tags sqlite_fts5 ./...
